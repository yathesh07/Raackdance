    <script>
        function reloadCaptcha() {
            const captchaImage = document.getElementById('captcha-image');
            captchaImage.src = 'captcha.php?' + new Date().getTime();
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('captcha-message').textContent = '';
            document.getElementById('captcha').value = '';
        }

        function validateCaptcha() {
            const captchaInput = document.getElementById('captcha');
            const captchaMessage = document.getElementById('captcha-message');
            const submitBtn = document.getElementById('submitBtn');

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'captcha_validation.php', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

            xhr.onload = function () {
                if (xhr.status === 200) {
                    if (xhr.responseText === 'success') {
                        captchaMessage.textContent = 'CAPTCHA is correct!';
                        captchaMessage.style.color = 'green';
                        submitBtn.disabled = false;
                        submitBtn.style.display = 'inline-block';
                    } else {
                        captchaMessage.textContent = 'Incorrect CAPTCHA. Please try again.';
                        captchaMessage.style.color = 'red';
                        submitBtn.disabled = true;
                        submitBtn.style.display = 'none';
                    }
                }
            };

            xhr.send('captcha=' + encodeURIComponent(captchaInput.value));
        }

        // Enable submit button if all fields are valid
        const form = document.getElementById('contact-form');
        form.addEventListener('input', function () {
            let isValid = true;
            const errorMessages = [];
            const inputs = form.querySelectorAll('input[required], select[required]');

            // Check if all required fields are filled out
            inputs.forEach(function (input) {
                if (!input.value) {
                    isValid = false;
                    errorMessages.push(input.placeholder || input.name || input.id + ' is required.');
                }
            });

            // Validate CAPTCHA if it's present
            const captchaInput = document.getElementById('captcha');
            if (captchaInput && !captchaInput.value) {
                isValid = false;
                errorMessages.push('CAPTCHA is required.');
            }

            // Display error messages if form is invalid
            const errorMessageContainer = document.getElementById('form-error-messages');
            if (!isValid) {
                errorMessageContainer.innerHTML = errorMessages.join('<br>');
                errorMessageContainer.style.color = 'Green';
            } else {
                errorMessageContainer.innerHTML = '';
            }

            // Enable/disable submit button
            const submitBtn = document.getElementById('submitBtn');
            if (isValid && !submitBtn.disabled) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        });
    </script>
    <script>
        function toggleWhatsAppField(show) {
            const whatsappField = document.getElementById('whatsapp-number');
            if (show) {
                whatsappField.style.display = 'block';
                whatsappField.setAttribute('required', 'true');
            } else {
                whatsappField.style.display = 'none';
                whatsappField.removeAttribute('required');
            }
        }
        function updateCountryAndLength() {
            const countryCodeSelect = document.getElementById('country_code');
            const selectedOption = countryCodeSelect.options[countryCodeSelect.selectedIndex];
            const country = selectedOption.getAttribute('data-country');
            const phoneLength = selectedOption.getAttribute('data-length');

            document.getElementById('country').value = country;
            document.getElementById('phone').setAttribute('maxlength', phoneLength);
        }

        function validatePhoneLength() {
            const phoneInput = document.getElementById('phone');
            const countryCodeSelect = document.getElementById('country_code');
            const selectedOption = countryCodeSelect.options[countryCodeSelect.selectedIndex];
            const phoneLength = parseInt(selectedOption.getAttribute('data-length'), 10);

            if (phoneInput.value.length > phoneLength) {
                phoneInput.value = phoneInput.value.slice(0, phoneLength);
            }
        }
    </script>
